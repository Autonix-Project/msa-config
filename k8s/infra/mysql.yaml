# =====================================================
# 옵션 A: MySQL 컨테이너 (개발 / 테스트 환경)
# 옵션 B (RDS 사용 시): 이 파일 전체 적용 안 하고
#   secret.yaml의 DB_PASSWORD + configmap의 MYSQL_HOST(RDS 엔드포인트)만 설정하면 됨
# =====================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: autonix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2   # EKS 기본 StorageClass
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: autonix
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autonix-secrets
                  key: MYSQL_ROOT_PASSWORD
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init-sql
          configMap:
            name: mysql-init-sql  # init SQL을 ConfigMap으로 올리거나 별도 처리
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: autonix
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None  # Headless (StatefulSet)
